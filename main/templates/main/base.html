{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bloodborne{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
    <link rel="icon" href="{% static 'main/images/logo_16x16.jpg' %}" type="image/png">
</head>

<body>
<header>
    <a href="{% url 'home' %}">
        <img src="{% static 'main/images/logo.jpg' %}" alt="Bloodborne">
    </a>

    <nav>
        <a href="{% url 'home' %}">Главная</a>
        <a href="{% url 'about' %}">О Bloodborne</a>
        <a href="{% url 'blog' %}">Блог</a>
        <a href="{% url 'resources' %}">Полезные ресурсы</a>
        <a href="{% url 'videos' %}">Видео</a>
        <a href="{% url 'pool' %}">Обратная связь</a>
        

        {% if user.is_authenticated %}
            <span>Вы вошли как: {{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Выйти</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Войти</a>
            <a href="{% url 'register' %}">Регистрация</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
