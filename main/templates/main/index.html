{% extends 'main/base.html' %}
{% load static %}

{% block content %}
<div class="carousel">
    <div class="carousel-images">
        <img src="{% static 'main/content/image1.jpg' %}" alt="Bloodborne — изображение 1">
        <img src="{% static 'main/content/image2.jpg' %}" alt="Bloodborne — изображение 2">
        <img src="{% static 'main/content/image3.jpg' %}" alt="Bloodborne — изображение 3">
    </div>

    <button class="carousel-prev" type="button">&#10094;</button>
    <button class="carousel-next" type="button">&#10095;</button>
</div>

<script>
    const carousel = document.querySelector('.carousel-images');
    const images = document.querySelectorAll('.carousel-images img');
    const prevButton = document.querySelector('.carousel-prev');
    const nextButton = document.querySelector('.carousel-next');

    let currentIndex = 0;

    nextButton.addEventListener('click', function() {
        currentIndex++;

        if (currentIndex >= images.length) {
            currentIndex = 0;
        }

        carousel.style.transform = `translateX(-${currentIndex * 100}%)`;
    });

    prevButton.addEventListener('click', function() {
        currentIndex--;

        if (currentIndex < 0) {
            currentIndex = images.length - 1;
        }

        carousel.style.transform = `translateX(-${currentIndex * 100}%)`;
    });

    setInterval(function() {
    currentIndex++;

    if (currentIndex >= images.length) {
        currentIndex = 0;
    }

    carousel.style.transform = `translateX(-${currentIndex * 100}%)`;
    }, 5000);
</script>

<p>В данном вэб-журнале будет информация о Bloodborne, а именно о:
    <ul>
        <li>персонажах;</li>
        <li>оружии;</li>
        <li>боссах;</li>
        <li>локациях;</li>
        <li>сюжете;</li>
        <li>и так далее.</li>
    </ul>
</p>
{% endblock %}
